<section class="related" *ngIf="posts.length">
  <h2>Related</h2>
  <div class="related__grid">
    <article *ngFor="let post of posts">
      <h3>
        <a [routerLink]="['/blog', post.slug]">{{ post.title }}</a>
      </h3>
      <p>{{ post.excerpt }}</p>
      <span>{{ post.dateISO }}</span>
    </article>
  </div>
</section>
