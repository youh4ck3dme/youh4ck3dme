<section class="hero" role="presentation">
  <div class="hero__background">
    <div class="hero__nebula" aria-hidden="true"></div>
    <div class="hero__dust" aria-hidden="true"></div>
    <div class="hero__silhouette" aria-hidden="true"></div>
  </div>
  <div class="hero__content glass-panel">
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>
    <div class="hero__actions">
      <a class="btn btn--primary" routerLink="/rezervacia">{{ ctaLabel }}</a>
      <a class="btn btn--ghost" routerLink="/galeria">{{ secondaryCtaLabel }}</a>
    </div>
  </div>
  <div class="hero__glass" aria-hidden="true"></div>
</section>
