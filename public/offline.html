<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RiggedGuard Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #0b1120, #01040f);
        color: #f8fafc;
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        text-align: center;
        padding: 2rem;
      }
      .card {
        border: 1px solid rgba(0, 255, 163, 0.45);
        border-radius: 18px;
        padding: 2rem;
        background: rgba(10, 19, 40, 0.85);
        max-width: 420px;
      }
      h1 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Casino floor offline</h1>
      <p>The pit boss lost network visibility. Reconnect to resume RiggedGuard Rampage React scans.</p>
    </div>
  </body>
</html>
